<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>语音识别测试 v2</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#000;color:#fff;font-family:-apple-system,"PingFang SC",sans-serif;-webkit-text-size-adjust:100%}
h1{font-size:20px;margin:0 0 10px}
.card{background:#1c1c1e;border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px;line-height:1.6}
.k{color:#8e8e93}
button{width:100%;height:50px;border:0;border-radius:12px;background:#3a3a3c;color:#fff;font-size:16px;margin-bottom:8px;text-align:left;padding:0 14px}
button b{color:#ffd54a;margin-right:8px}
button.stop{background:#ff453a}
#tx{font-size:22px;line-height:1.6;min-height:90px;word-break:break-all}
#tx .i{color:#8e8e93}
#log{font-size:12px;color:#aeaeb2;max-height:220px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace}
.ok{color:#30d158}.bad{color:#ff453a}
#crash{display:none;background:#3a1010;border:1px solid #ff453a}
</style>
</head>
<body>
<h1>语音识别测试 v2</h1>

<div class="card" id="crash"></div>
<div class="card" id="env"></div>

<button id="b0"><b>①</b>只测麦克风（不识别）</button>
<button id="b1"><b>②</b>最简识别（单句，无实时字，不设语言）</button>
<button id="b2"><b>③</b>单句识别（中文，有实时字）</button>
<button id="b3"><b>④</b>连续识别（中文，有实时字）</button>
<button id="bs" class="stop" style="display:none">停止</button>

<div class="card">
  <div class="k">识别出来的字（白色=确定，灰色=还在猜）</div>
  <div id="tx"></div>
</div>

<div class="card">
  <div class="k">过程记录（崩溃重开后也会保留，截图发我）</div>
  <div id="log"></div>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var m=navigator.userAgent.match(/OS (\d+)_(\d+)/);
$('env').innerHTML='系统：'+(m?('iOS '+m[1]+'.'+m[2]):'非 iOS')+'<br>语音识别接口：'+(SR?'<span class="ok">有</span>':'<span class="bad">没有</span>')+'<br>https：'+(location.protocol==='https:'?'<span class="ok">是</span>':'<span class="bad">否</span>');

var t0=Date.now(),KEY='asr.crumbs';
function crumb(s){
  var line=((Date.now()-t0)/1000).toFixed(1)+'s '+s;
  try{var a=JSON.parse(localStorage.getItem(KEY)||'[]');a.push(line);if(a.length>60)a=a.slice(-60);localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}
  var el=$('log');el.textContent+=line+'\n';el.scrollTop=el.scrollHeight;
}
/* 上次是否崩溃：记录里最后一行不是「正常结束」就说明页面在那一步死掉了 */
try{
  var prev=JSON.parse(localStorage.getItem(KEY)||'[]');
  if(prev.length){
    var last=prev[prev.length-1];
    if(last.indexOf('正常结束')<0){
      var c=$('crash');c.style.display='block';
      c.innerHTML='<b class="bad">上次页面在这一步之后消失了（疑似崩溃）：</b><br>'+last+'<br><span class="k">完整记录在下面。</span>';
      $('log').textContent='--- 上次的记录 ---\n'+prev.join('\n')+'\n--- 本次 ---\n';
    }
  }
  localStorage.setItem(KEY,'[]');
}catch(e){}

var rec=null,running=false,done='';
function busy(on){running=on;$('bs').style.display=on?'block':'none'}
function render(fin,interim){$('tx').innerHTML=done+fin+'<span class="i">'+interim+'</span>'}

function testMic(){
  crumb('①开始：准备调用 getUserMedia');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){crumb('①没有 getUserMedia');return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
    crumb('①麦克风拿到了，1 秒后关闭');
    setTimeout(function(){s.getTracks().forEach(function(t){t.stop()});crumb('①正常结束')},1000);
  }).catch(function(e){crumb('①失败：'+(e&&e.name))});
}

function testRec(mode){
  if(!SR){crumb('没有语音识别接口');return}
  done='';$('tx').textContent='';
  crumb(mode+'开始：准备 new SpeechRecognition');
  rec=new SR();
  crumb(mode+'对象创建成功');
  if(mode!=='②'){rec.lang='zh-CN';rec.interimResults=true}
  rec.continuous=(mode==='④');
  crumb(mode+'参数已设置：continuous='+rec.continuous+' lang='+(rec.lang||'默认'));
  rec.onstart=function(){crumb(mode+'onstart')};
  rec.onaudiostart=function(){crumb(mode+'onaudiostart 麦克风接通')};
  rec.onspeechstart=function(){crumb(mode+'onspeechstart 听到说话')};
  var gotFirst=false;
  rec.onresult=function(e){
    if(!gotFirst){gotFirst=true;crumb(mode+'第一次出字')}
    var fin='',interim='';
    for(var i=0;i<e.results.length;i++){var r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else interim+=r[0].transcript}
    render(fin,interim);rec._cur=fin;
  };
  rec.onerror=function(e){crumb(mode+'错误：'+e.error)};
  rec.onend=function(){crumb(mode+'onend');busy(false);crumb(mode+'正常结束')};
  crumb(mode+'准备调用 start()');
  busy(true);
  try{rec.start();crumb(mode+'start() 已返回')}catch(err){crumb(mode+'start 抛错：'+err.message);busy(false)}
}

$('b0').addEventListener('click',testMic);
$('b1').addEventListener('click',function(){testRec('②')});
$('b2').addEventListener('click',function(){testRec('③')});
$('b3').addEventListener('click',function(){testRec('④')});
$('bs').addEventListener('click',function(){try{rec.stop()}catch(_){}crumb('已点停止')});
})();
</script>
</body>
</html>
